[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "verirepro"
version = "0.8.3"
description = "Evidence-grounded agent for verifiable computational paper reproduction"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = "Apache-2.0"
license-files = ["LICENSE"]
keywords = ["reproducibility", "ai-agent", "research", "arxiv", "scientific-computing", "paper-reproduction"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Typing :: Typed",
  "Topic :: Scientific/Engineering",
  "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
  "packaging>=24,<27",
  "Pillow>=10,<13",
  "pypdf>=5.0,<7",
  "PyYAML>=6.0,<7",
  "requests>=2.32,<3",
]

[project.optional-dependencies]
dev = [
  "build>=1.2,<2",
  "coverage[toml]>=7.6,<8",
  "mypy>=1.15,<2",
  "pytest>=8.0,<9",
  "pytest-cov>=6,<8",
  "ruff>=0.12,<1",
  "types-PyYAML>=6.0,<7",
  "twine>=6,<7",
]

[project.urls]
Homepage = "https://github.com/XiantingWu/VeriRepro"
Repository = "https://github.com/XiantingWu/VeriRepro"
Issues = "https://github.com/XiantingWu/VeriRepro/issues"
Documentation = "https://github.com/XiantingWu/VeriRepro/tree/main/docs"
Changelog = "https://github.com/XiantingWu/VeriRepro/blob/main/CHANGELOG.md"
Security = "https://github.com/XiantingWu/VeriRepro/security"

[project.scripts]
verirepro = "verirepro.cli:main"
verirepro-reprobench = "reproagent.reprobench_adapter:main"
verirepro-reprobench-summary = "reproagent.reprobench_summary:main"
reproagent = "reproagent.cli:main"

[tool.hatch.build.targets.sdist]
core-metadata-version = "2.4"

[tool.hatch.build.targets.wheel]
core-metadata-version = "2.4"
packages = ["src/verirepro", "src/reproagent"]

[tool.coverage.run]
branch = true
source = ["reproagent", "verirepro"]

[tool.coverage.report]
show_missing = true
skip_covered = false
precision = 1

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
files = [
  "src/verirepro",
  "src/reproagent",
]
follow_imports = "skip"
check_untyped_defs = true
disallow_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_configs = true
warn_unused_ignores = true
